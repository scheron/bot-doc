# Translates Russian documentation into English and opens a pull request with
# the result.
#
# It runs by itself when a change to assets/ru lands on master. To have a
# document translated again, because its English version reads badly, name it
# under Actions -> Run workflow, or from a terminal:
#
#   gh workflow run translate-docs.yml -f files="assets/ru/api.md assets/ru/faq.md"
#
# A named document is always translated afresh. Nothing is lost by that: the
# result arrives as a pull request, so the current English text stays on master
# until somebody reads the diff and merges it.

name: Translate changed documentation

on:
  push:
    branches:
      - master
    paths:
      - 'assets/ru/**'
  workflow_dispatch:
    inputs:
      files:
        description: 'Which documents to translate, for example: assets/ru/api.md assets/ru/faq.md'
        required: false
      base_ref:
        description: 'Advanced. Commit to compare against. Leave empty unless you know you need it.'
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: documentation-translation
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    env:
      TRANSLATION_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TRANSLATION_PROVIDER: ${{ vars.TRANSLATION_PROVIDER || 'deepseek' }}
      TRANSLATION_MODEL: ${{ vars.TRANSLATION_MODEL || 'deepseek-v4-flash' }}
      NODE_OPTIONS: --openssl-legacy-provider

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run script tests
        run: yarn test

      - name: Plan the translation
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          MANUAL_BASE: ${{ inputs.base_ref }}
          MANUAL_FILES: ${{ inputs.files }}
        run: node scripts/translation/ci/plan.mjs

      - name: Refuse documents already waiting in an open translation PR
        if: steps.plan.outputs.files != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED_DOCS: ${{ steps.plan.outputs.files }}
        run: node scripts/translation/ci/assert-not-in-review.mjs

      - name: Translate changed documents
        if: steps.plan.outputs.mode == 'range'
        env:
          BASE: ${{ steps.plan.outputs.base }}
          TRANSLATION_USAGE_FILE: ${{ runner.temp }}/translation-usage.json
        run: node scripts/translation/translate-docs.mjs --base "$BASE"

      - name: Translate the requested documents
        if: steps.plan.outputs.mode == 'files'
        env:
          FILES: ${{ steps.plan.outputs.files }}
          TRANSLATION_USAGE_FILE: ${{ runner.temp }}/translation-usage.json
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: node scripts/translation/translate-docs.mjs --files $FILES $FORCE

      - name: Validate frontmatter and local links
        if: steps.plan.outputs.files != ''
        env:
          CHANGED_DOCS: ${{ steps.plan.outputs.files }}
        run: node scripts/translation/validate-translations.mjs $CHANGED_DOCS

      - name: Build documentation site
        run: yarn build

      - name: Create translation pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.ref_name }}
          TRANSLATION_USAGE_FILE: ${{ runner.temp }}/translation-usage.json
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
        run: node scripts/translation/ci/open-pull-request.mjs
