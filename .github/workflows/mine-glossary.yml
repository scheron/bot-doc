# Mines the documentation corpus for terms that should never be translated
# and opens a pull request extending the machine word list
# (.github/prompts/do-not-translate.md) with what it finds.
#
# Manual only: run it from Actions -> Run workflow, or from a terminal:
#
#   gh workflow run mine-glossary.yml
#
# Run it whenever documentation has accumulated enough new content that new
# untranslatable terms are likely to be hiding in it.

name: Mine the untranslatable-term glossary

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: glossary-mining
  cancel-in-progress: false

jobs:
  mine:
    runs-on: ubuntu-latest
    env:
      TRANSLATION_API_KEY: ${{ secrets.TRANSLATION_API_KEY }}
      GLOSSARY_PROVIDER: ${{ vars.GLOSSARY_PROVIDER || vars.TRANSLATION_PROVIDER || 'deepseek' }}
      GLOSSARY_MODEL: ${{ vars.GLOSSARY_MODEL || vars.TRANSLATION_MODEL || 'deepseek-v4-flash' }}
      NODE_OPTIONS: --openssl-legacy-provider

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run script tests
        run: yarn test

      - name: Mine the glossary
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: yarn mine-glossary
